name: Queue worker
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min — process in-app requests
  workflow_dispatch:
  repository_dispatch:       # external pinger heartbeat (GitHub cron is unreliable)
    types: [heartbeat]

# Only ONE worker at a time. Multiple concurrent workers all log into the SINGLE Realtime
# session and collide (caused mass manual-punch failures 2026-06-14 when a heartbeat backlog
# ran ~6 workers at once). Queue extra runs instead of cancelling (never kill a run mid-insert).
concurrency:
  group: nsp-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: jobs
        run: npm ci
      - working-directory: jobs
        run: npx playwright install --with-deps chromium
      - working-directory: jobs
        run: node worker.js
        env:
          REALTIME_CORP: ${{ secrets.REALTIME_CORP }}
          REALTIME_USER: ${{ secrets.REALTIME_USER }}
          REALTIME_PASS: ${{ secrets.REALTIME_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}   # lets the worker re-trigger publish-state when the floor snapshot goes stale (self-heal)
