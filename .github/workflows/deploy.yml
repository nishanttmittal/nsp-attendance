name: Deploy PWA to Pages
# 2026-08-12 (owner: "only one app link"): the github.io URL is RETIRED. Pages now publishes
# only redirect/ — a forwarder to https://unico-operations.firebaseapp.com/attendance/ that
# preserves path+query (old punch.html links keep working) plus a kill-switch sw.js that
# unregisters the old cached PWA. The real app deploys to Firebase Hosting from
# ~/unico-default-site (see memory: session-2026-08-11-portal-roster-sync deploy runbook).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
