name: Publish live floor state
on:
  schedule:
    - cron: '*/15 3-16 * * *'   # every 15 min, ~09:00–21:30 IST (UTC+5:30)
  workflow_dispatch:
  repository_dispatch:       # GitHub cron is unreliable: heartbeat = keepalive chain,
    types: [heartbeat, refresh_floor]   # refresh_floor = worker self-heal when the snapshot goes stale

# Serialize scrapes: publishState.js logs into the SINGLE Realtime session. Two concurrent logins
# collide (the documented mass manual-punch failure 2026-06-14). A scheduled run + a self-heal
# refresh_floor could otherwise race; queue the second instead of running both.
concurrency:
  group: nsp-publish-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: jobs
        run: npm ci
      - working-directory: jobs
        run: npx playwright install --with-deps chromium
      - working-directory: jobs
        run: node publishState.js
        env:
          REALTIME_CORP: ${{ secrets.REALTIME_CORP }}
          REALTIME_USER: ${{ secrets.REALTIME_USER }}
          REALTIME_PASS: ${{ secrets.REALTIME_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Welder new-challan alert
        if: always()   # independent of floor scrape; read-only on welder data
        working-directory: jobs
        run: node welderChallanAlert.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
