name: Scheduled alerts & maintenance
on:
  schedule:
    - cron: '10 12 * * *'   # 17:40 IST — food headcount
    # evening missed-punch (21:30 IST) REMOVED 2026-07-06 — real-time read was inaccurate
    # (out-punches not yet synced + workers still on floor). Morning alert (yesterday, accurate) kept.
    - cron: '30 4 * * *'    # 10:00 IST — morning missed-punch (yesterday)
    - cron: '30 3 * * *'    # 09:00 IST — long absence (>4 days)
    - cron: '0 7 * * *'     # 12:30 IST — morning attendance summary (after portal rolls to today; also date-guarded)
    - cron: '30 1 * * *'    # 07:00 IST — reprocess yesterday
    - cron: '45 1 * * *'    # 07:15 IST — publish salary attendance (att_attendance)
    # weekly Sun Telegram backup REMOVED 2026-07-17 (owner: no backup files on Telegram) —
    # replaced by the nightly private-repo backup below; "backup" stays as a manual task.
    - cron: '15 21 * * *'   # 02:45 IST nightly — ALL apps backup → private unico-backups repo (Sun = full incl. laser_jobs)
    - cron: '30 21 * * *'   # 03:00 IST daily — app freshness watchdog (alert if a live app has gone quiet)
    - cron: '15 2 * * *'    # 07:45 IST daily — sync employee names/dept from Realtime portal (att_salary)
    - cron: '30 2 * * *'    # 08:00 IST daily — world metal benchmark (metals.dev) → costing Live Rates
    - cron: '30 14 * * *'   # 20:00 IST — welder daily production summary
    - cron: '35 14 * * *'   # 20:05 IST — plating daily summary
    - cron: '40 14 * * *'   # 20:10 IST — transport freight balance alerts (gaadiwala owed too much)
    - cron: '30 13 * * 6'   # Sat 19:00 IST — welder contractor pay-ready (last 7 days)
  workflow_dispatch:
    inputs:
      task:
        description: which task to run manually
        type: choice
        options: [headcount, evening-miss, morning-miss, morning-summary, long-absence, reprocess, salary-data, backup, all-backup, welder-backup, sync-employees, welder-production, plating-summary, freight-alerts, welder-pay, app-freshness, metals-benchmark]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: jobs
        run: npm ci
      - working-directory: jobs
        run: npx playwright install --with-deps chromium
      - name: Run scheduled task
        working-directory: jobs
        env:
          SCHED: ${{ github.event.schedule }}
          TASK: ${{ github.event.inputs.task }}
          REALTIME_CORP: ${{ secrets.REALTIME_CORP }}
          REALTIME_USER: ${{ secrets.REALTIME_USER }}
          REALTIME_PASS: ${{ secrets.REALTIME_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: |
          case "${TASK:-$SCHED}" in
            "headcount"|"10 12 * * *")   node eveningHeadcount.js ;;
            "evening-miss")  MODE=evening node missedPunch.js ;;   # manual only (no schedule)
            "morning-miss"|"30 4 * * *")  MODE=morning node missedPunch.js ;;
            "morning-summary"|"0 7 * * *") node morningSummary.js ;;
            "long-absence"|"30 3 * * *")  THRESHOLD=4 node longAbsence.js ;;
            "reprocess"|"30 1 * * *")     node dailyReprocess.js ;;
            "salary-data"|"45 1 * * *")   node publishSalaryData.js ;;
            "backup")                     node backup.js ;;   # manual only — Telegram file on demand
            "all-backup"|"welder-backup"|"15 21 * * *")
              node fullBackup.js   # ALL apps, one JSON each; laser_jobs weekly-full only (quota)
              # push per-app JSONs to the PRIVATE unico-backups repo (no Telegram on success)
              mkdir -p ~/.ssh && printf '%s\n' "$BACKUP_DEPLOY_KEY" > ~/.ssh/backup_key && chmod 600 ~/.ssh/backup_key
              ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
              export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o IdentitiesOnly=yes"
              git clone --depth 1 git@github.com:nishanttmittal/unico-backups.git /tmp/ubk
              for f in downloads/allbackup/*-backup-*.json; do
                app=$(basename "$f" | sed 's/-backup-[0-9-]*\.json$//')
                mkdir -p "/tmp/ubk/$app" && cp "$f" "/tmp/ubk/$app/"
                ls "/tmp/ubk/$app/$app"-backup-*.json | sort | head -n -60 | xargs -r rm --   # keep last 60 nights
              done
              git -C /tmp/ubk config user.email "backup-bot@unico" && git -C /tmp/ubk config user.name "unico-backup-bot"
              git -C /tmp/ubk add -A
              git -C /tmp/ubk commit -m "nightly backup $(date -u +%F)" || echo "nothing new"
              git -C /tmp/ubk push
              ;;
            "app-freshness"|"30 21 * * *") node appFreshness.js ;;
            "sync-employees"|"15 2 * * *") node syncEmployees.js ;;
            "metals-benchmark"|"30 2 * * *") node fetchMetalsBenchmark.js ;;
            "welder-production"|"30 14 * * *") node welderProduction.js ;;
            "plating-summary"|"35 14 * * *")  node platingSummary.js ;;
            "freight-alerts"|"40 14 * * *")   node freightAlerts.js ;;
            "welder-pay"|"30 13 * * 6")        node welderContractorPay.js ;;
            *) echo "no task matched ${TASK:-$SCHED}" ;;
          esac
      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHED: ${{ github.event.schedule }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Scheduled job FAILED: ${TASK:-$SCHED} (nsp-attendance Actions) — backups/alerts may not have run."
